<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Pedang Ghazi</title>
</head>
<body style="background-color: red; text-align: center; color: white; font-family: sans-serif;">

    <h1>ghazi</h1>

    <!-- Gambar Pedang menggunakan SVG -->
    <svg width="150" height="400" viewBox="0 0 150 400" xmlns="http://www.w3.org/2000/svg">
        <!-- Ujung Pedang -->
        <polygon points="75,10 55,60 95,60" fill="#e0e0e0" />
        
        <!-- Bilah Pedang (Kiri Terang, Kanan Agak Gelap untuk Efek 3D) -->
        <rect x="55" y="60" width="20" height="220" fill="#f5f5f5" />
        <rect x="75" y="60" width="20" height="220" fill="#bdbdbd" />
        
        <!-- Garis Tengah Bilah -->
        <line x1="75" y1="20" x2="75" y2="280" stroke="#9e9e9e" stroke-width="2" />

        <!-- Pelindung Tangan (Crossguard) -->
        <rect x="25" y="280" width="100" height="18" rx="5" fill="#ffd700" stroke="#b8860b" stroke-width="2" />
        
        <!-- Gagang Pedang (Grip) -->
        <rect x="65" y="298" width="20" height="65" fill="#5d4037" />
        <!-- Lilitan Gagang -->
        <line x1="65" y1="312" x2="85" y2="318" stroke="#3e2723" stroke-width="4" />
        <line x1="65" y1="330" x2="85" y2="336" stroke="#3e2723" stroke-width="4" />
        <line x1="65" y1="348" x2="85" y2="354" stroke="#3e2723" stroke-width="4" />

        <!-- Ujung Bawah Gagang (Pommel) -->
        <circle cx="75" cy="372" r="14" fill="#ffd700" stroke="#b8860b" stroke-width="2" />
    </svg>

</body>
</html>
